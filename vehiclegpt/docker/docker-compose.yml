# Edge-constrained deployment: the whole stack (app + LLM) capped at 2 CPU cores / 2 GB RAM.
#   docker compose -f docker/docker-compose.yml up --build -d
#   docker compose -f docker/docker-compose.yml exec ollama ollama pull qwen2.5:1.5b
#   open http://localhost:8501      ·   docker stats   (live CPU / memory per container)
services:
  ollama:
    image: ollama/ollama:latest
    cpus: 2
    mem_limit: 1536m
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    volumes:
      - ollama:/root/.ollama
  vehiclegpt:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    cpus: 2
    mem_limit: 512m
    environment:
      - OLLAMA_URL=http://ollama:11434
      - VGPT_EDGE=1
    ports:
      - "8501:8501"
    volumes:
      - vgpt-data:/app/data
    depends_on:
      - ollama
volumes:
  ollama:
  vgpt-data:
